<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Agent Cluster</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --running: #3fb950;
    --done: #58a6ff;
    --error: #f85149;
    --accent: #7c3aed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .stats {
    display: flex;
    gap: 20px;
    font-size: 14px;
  }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.running { background: var(--running); }
  .dot.done { background: var(--done); }
  .dot.error { background: var(--error); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    transition: border-color 0.2s;
  }
  .card.running { border-left: 3px solid var(--running); }
  .card.done { border-left: 3px solid var(--done); }
  .card.error { border-left: 3px solid var(--error); }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .card-role { font-weight: 600; font-size: 14px; }
  .card-status {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 12px;
  }
  .card-status.running { background: rgba(63,185,80,0.15); color: var(--running); }
  .card-status.done { background: rgba(88,166,255,0.15); color: var(--done); }
  .card-status.error { background: rgba(248,81,73,0.15); color: var(--error); }
  .card-id { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
  .card-action {
    font-size: 13px;
    color: var(--dim);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-round { font-size: 12px; color: var(--dim); }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 8px 0;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--running);
    border-radius: 2px;
    transition: width 0.3s;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .events {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    max-height: 300px;
    overflow-y: auto;
  }
  .event { font-size: 12px; color: var(--dim); padding: 2px 0; }
  .conversation {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
    max-height: 400px;
    overflow-y: auto;
  }
  .msg {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg:last-child { border-bottom: none; }
  .msg.user { color: var(--accent); }
  .msg.agent { color: var(--text); }
  .cmd-bar {
    display: flex;
    gap: 8px;
  }
  .cmd-bar input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .cmd-bar input:focus { border-color: var(--accent); }
  .cmd-bar button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .cmd-bar button:hover { opacity: 0.9; }
  .empty {
    text-align: center;
    color: var(--dim);
    padding: 40px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🖥 Relay Agent Cluster</h1>
  <div class="stats">
    <div class="stat"><span class="dot running"></span> 运行中: <strong id="stat-running">0</strong></div>
    <div class="stat"><span class="dot done"></span> 完成: <strong id="stat-done">0</strong></div>
    <div class="stat"><span class="dot error"></span> 错误: <strong id="stat-error">0</strong></div>
  </div>
</div>

<div class="section-title">📋 Agent 看板</div>
<div class="grid" id="grid"><div class="empty">等待第一个子 Agent...</div></div>

<div class="section-title">🛰 服务集群</div>
<div class="events" id="services"><div class="event">等待服务...</div></div>

<div class="section-title">🔀 控制流（编排图）</div>
<div class="events" id="flows"><div class="event">等待编排数据...</div></div>

<div class="section-title">🎯 门控命中</div>
<div class="events" id="gate-hits"><div class="event">等待事件...</div></div>

<div class="section-title">📜 事件审计（可回溯）</div>
<div class="events" id="audit"><div class="event">等待审计数据...</div>
  <div style="margin-top:8px">
    <select id="audit-filter" onchange="loadAudit()">
      <option value="">全部服务</option>
    </select>
    <span style="font-size:11px;color:var(--dim)">最近 30 条，倒序</span>
  </div>
</div>

<div class="section-title">💬 对话</div>
<div class="conversation" id="conversation"><div class="msg">等待指令...</div></div>

<div class="section-title" onclick="toggleEvents()" style="cursor:pointer">📢 事件 ▾</div>
<div class="events" id="events"><div class="event">等待指令...</div></div>

<div class="cmd-bar">
  <input type="text" id="cmd" placeholder="派一个子agent分析 src/tools.ts，把报告写入 docs/analysis.md" />
  <button onclick="sendCmd()">发送</button>
</div>

<script>
const STATUS_CN = { running: "运行中", done: "已完成", error: "错误" };
const STATUS_EMOJI = { running: "🔄", done: "✅", error: "❌" };

function renderCard(a) {
  const pct = a.progress ? Math.round((a.progress.round / (a.progress.totalRounds || 30)) * 100) : 0;
  return `
    <div class="card ${a.status}">
      <div class="card-header">
        <span class="card-role">${STATUS_EMOJI[a.status] || ""} ${a.role}</span>
        <span class="card-status ${a.status}">${STATUS_CN[a.status] || a.status}</span>
      </div>
      <div class="card-id">ID: ${a.id}</div>
      ${a.status === "running" ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>` : ""}
      ${a.progress ? `<div class="card-round">第 ${a.progress.round}/${a.progress.totalRounds || 30} 轮 — ${a.progress.lastAction}</div>` : ""}
      ${a.summary ? `<div class="card-action">${a.summary.slice(0, 300)}</div>` : ""}
    </div>`;
}

function render(state) {
  document.getElementById("stat-running").textContent = state.running;
  document.getElementById("stat-done").textContent = state.done;
  document.getElementById("stat-error").textContent = state.errors;

  const grid = document.getElementById("grid");
  if (!state.agents || state.agents.length === 0) {
    grid.innerHTML = '<div class="empty">等待第一个子 Agent...</div>';
  } else {
    grid.innerHTML = state.agents.map(renderCard).join("");
  }
}

function addMessage(text, cls) {
  const el = document.getElementById("conversation");
  el.innerHTML += `<div class="msg ${cls}">${text}</div>`;
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 30) el.firstChild.remove();
}

function addEvent(msg) {
  const el = document.getElementById("events");
  el.innerHTML += `<div class="event">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 20) el.firstChild.remove();
}

let ws;
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === "state") render(data);
    if (data.type === "event") addEvent(data.msg);
    if (data.type === "sink") {
      const ev = data.event;
      if (ev.kind === "agent_dispatched") {
        addMessage(`🚀 派出 [${ev.role}]: ${(ev.task || "").slice(0, 100)}`, "agent");
        addEvent(`🚀 ${ev.agentId} [${ev.role}] 已派出`);
      }
      if (ev.kind === "agent_done") {
        addMessage(`✅ [${ev.role}] 完成: ${(ev.output || "").slice(0, 300)}`, "agent");
        addEvent(`✅ ${ev.agentId} [${ev.role}] 完成`);
      }
      if (ev.kind === "agent_error") {
        addMessage(`❌ [${ev.role}] 错误: ${(ev.error || "").slice(0, 200)}`, "agent");
        addEvent(`❌ ${ev.agentId} [${ev.role}] 错误`);
      }
      if (ev.kind === "llm_response") {
        addMessage(ev.text, "agent");
        addEvent(`💬 Agent 回复`);
      }
      if (ev.kind === "notice" && ev.text.startsWith("💡")) {
        addMessage(ev.text.replace("💡 Web: ", ""), "user");
        addEvent(`📨 ${ev.text.replace("💡 Web: ", "").slice(0, 60)}`);
      }
    }
  };

  ws.onclose = () => { setTimeout(connect, 2000); };
}

function sendCmd() {
  const input = document.getElementById("cmd");
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = "";
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send("cmd:" + cmd);
  } else {
    // POST fallback when WebSocket not connected
    fetch("/api/cmd", { method: "POST", body: cmd });
  }
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderServices(data) {
  const el = document.getElementById("services");
  let html = "";
  if (data.state) {
    html += '<div class="event"><strong>状态模型</strong><br>' + esc(data.state).replace(/\n/g, "<br>") + "</div>";
  }
  if (data.services && data.services.length > 0) {
    for (const s of data.services) {
      const icon = s.status === "running" ? "🔄" : s.status === "error" ? "❌" : "⏹";
      html += '<div class="event">' + icon + " " + esc(s.id) + ": " + esc(s.status) +
        " (uptime " + Math.round(s.uptimeMs / 1000) + "s, 重启 " + s.restartCount + " 次)</div>";
    }
  }
  el.innerHTML = html || '<div class="event">无常驻服务</div>';
}

const DISP_CN = { immediate: "唤醒大脑", defer: "积攒", notify: "推送", archive: "归档", default: "默认分级" };

function renderFlows(data) {
  const el = document.getElementById("flows");
  const d = data.manifest;
  if (!d || d.services.length === 0) {
    el.innerHTML = '<div class="event">无常驻服务，无编排图</div>';
    return;
  }
  let html = "";
  // 校验结果
  const v = data.validation || {};
  for (const e of (v.errors || [])) {
    html += '<div class="event" style="color:var(--error)">✗ ' + esc(e) + "</div>";
  }
  for (const w of (v.warnings || [])) {
    html += '<div class="event" style="color:#d29922">⚠ ' + esc(w) + "</div>";
  }
  // 事件处置表
  html += '<div class="event"><strong>事件处置</strong></div>';
  for (const e of d.events) {
    const mark = e.source === "rule" ? "（规则）" : e.source === "contract" ? "（契约）" : "（默认）";
    html += '<div class="event">' + esc(e.serviceId) + "." + esc(e.eventType) +
      " → " + esc(DISP_CN[e.disposition] || e.disposition) + mark + "</div>";
  }
  // 路由（pipe）
  if (d.routes.length > 0) {
    html += '<div class="event"><strong>路由（pipe）</strong></div>';
    for (const r of d.routes) {
      html += '<div class="event">' + esc(r.from) + " ─" + esc(r.eventType) + "→ " +
        esc(r.to.join(", ")) + "</div>";
    }
  }
  // 节奏（timer）
  if (d.schedules.length > 0) {
    html += '<div class="event"><strong>节奏（timer）</strong></div>';
    for (const s of d.schedules) {
      const spec = s.spec.type === "interval" ? "每 " + s.spec.every : s.spec.type === "cron" ? "cron " + s.spec.expr : "at " + s.spec.ts;
      html += '<div class="event">' + esc(s.serviceId) + " @ " + esc(spec) + "</div>";
    }
  }
  // fan-out 声明
  if (data.flows && data.flows.length > 0) {
    html += '<div class="event"><strong>并行聚合（fan-out）</strong></div>';
    html += '<div class="event">flows: ' + data.flows.map(esc).join(", ") + "（flow run &lt;id&gt; 执行）</div>";
  }
  el.innerHTML = html;
}

const KIND_CN = { ready: "就绪", heartbeat: "心跳", state: "状态", event: "事件", progress: "进度", result: "结果", reply: "回复", request: "请求" };

function loadAudit() {
  const svc = document.getElementById("audit-filter").value;
  fetch("/api/audit?limit=30" + (svc ? "&serviceId=" + encodeURIComponent(svc) : ""))
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      const el = document.getElementById("audit");
      const select = document.getElementById("audit-filter");
      // 服务筛选下拉（保留当前选择）
      const services = [...new Set(rows.map(function (r) { return r.serviceId; }))].sort();
      const current = select.value;
      select.innerHTML = '<option value="">全部服务</option>' +
        services.map(function (s) {
          return '<option value="' + esc(s) + '"' + (s === current ? " selected" : "") + ">" + esc(s) + "</option>";
        }).join("");
      if (!rows.length) {
        el.insertAdjacentHTML("afterbegin", '<div class="event">暂无审计记录</div>');
        return;
      }
      // 只刷新列表部分（保留筛选控件）
      const listEl = el.querySelector(".audit-list");
      if (listEl) listEl.remove();
      const list = document.createElement("div");
      list.className = "audit-list";
      for (const r of rows) {
        const t = new Date(r.ts).toLocaleTimeString("zh-CN", { hour12: false });
        const type = r.type ? " " + esc(r.type) + (r.level ? "@" + esc(r.level) : "") : "";
        const payload = r.payload !== undefined ? " " + esc(JSON.stringify(r.payload).slice(0, 60)) : "";
        list.innerHTML += '<div class="event">[' + t + "] " + esc(r.serviceId) + " " +
          esc(KIND_CN[r.kind] || r.kind) + type + payload + "</div>";
      }
      el.insertBefore(list, select.parentElement);
    })
    .catch(function () { /* 静默 */ });
}

function renderGateHits(data) {
  const el = document.getElementById("gate-hits");
  const hits = data.gateHits || [];
  if (hits.length === 0) {
    el.innerHTML = '<div class="event">暂无门控决策</div>';
    return;
  }
  el.innerHTML = hits.slice(-20).reverse().map(function (h) {
    const t = new Date(h.ts).toLocaleTimeString("zh-CN", { hour12: false });
    return '<div class="event">[' + t + "] " + esc(h.action) + " ← " + esc(h.role) + "." + esc(h.eventType) +
      " (" + esc(h.level) + ")</div>";
  }).join("");
}

function pollServices() {
  fetch("/api/services").then(function (r) { return r.json(); }).then(function (d) {
    renderServices(d);
    renderGateHits(d);
  }).catch(function () { /* 服务未启动时静默 */ });
  fetch("/api/flows").then(function (r) { return r.json(); }).then(function (d) {
    renderFlows(d);
  }).catch(function () { /* 服务未启动时静默 */ });
  setTimeout(pollServices, 2000);
}

function toggleEvents() {
  const el = document.getElementById("events");
  const title = el.previousElementSibling;
  el.style.display = el.style.display === "none" ? "" : "none";
  title.textContent = el.style.display === "none" ? "📢 事件 ▸" : "📢 事件 ▾";
}
// events start collapsed
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("events").style.display = "none";
  document.querySelector(".section-title[onclick]").textContent = "📢 事件 ▸";
});

document.getElementById("cmd").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendCmd();
});

// initial load
fetch("/api/state").then(r => r.json()).then(render);
pollServices();
loadAudit();
setInterval(loadAudit, 5000);
fetch("/api/events").then(r => r.json()).then(events => {
  events.forEach(addEvent);
});
// 恢复对话（刷新不丢）
fetch("/api/conversation").then(r => r.json()).then(msgs => {
  const el = document.getElementById("conversation");
  el.innerHTML = "";
  if (!msgs || msgs.length === 0) {
    el.innerHTML = '<div class="msg">等待指令...</div>';
  } else {
    for (const m of msgs) {
      el.innerHTML += '<div class="msg ' + m.cls + '">' + m.text + '</div>';
    }
    el.scrollTop = el.scrollHeight;
  }
});
connect();
</script>
</body>
</html>
